name: ECRINTEL data engine
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: ecrintel-data-engine
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update global markets
        run: python scripts/update_markets.py
      - name: Update intelligence
        run: python scripts/update_intel.py
      - name: Update macro calendar
        run: python scripts/update_calendar.py
      - name: Commit data snapshot
        run: |
          git config user.name "ecrintel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets.json data/intel.json data/calendar.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh ECRINTEL"
          git pull --rebase origin main
          git push
