name: ECRINTEL data engine
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: ecrintel-data-engine
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh global markets
        run: python scripts/update_markets.py
      - name: Refresh current intelligence
        run: python scripts/update_intel.py
      - name: Refresh macro calendar when stale
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,time
          p=Path('data/calendar.json')
          if not p.exists() or time.time()-p.stat().st_mtime>21600:
              subprocess.check_call(['python','scripts/update_calendar.py'])
          PY
      - name: Publish newest snapshot
        run: |
          git config user.name "ecrintel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets.json data/intel.json data/calendar.json
          git diff --cached --quiet && exit 0
          git commit -m "data: live refresh ECRINTEL"
          git pull --rebase origin main
          git push origin HEAD:main
