name: ECRINTEL Android Build

on:
  workflow_dispatch:
  push:
    branches: [ android-app ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact ECRINTEL artwork
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d android/app/src/main/assets/ecrintel_icon_2026.b64 > android/app/src/main/res/drawable-nodpi/ecrintel_icon_2026_exact.jpg
          file android/app/src/main/res/drawable-nodpi/ecrintel_icon_2026_exact.jpg

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release bundle
        working-directory: android
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECRINTEL-debug-apk-v1.1.0
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ECRINTEL-release-aab-v1.1.0-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
